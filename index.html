<script>
(function () {
    var STORAGE_KEY = 'fd_recipient_name';
    var RECORD_URL  = "https://htmlku.my.id/v/20xKv/view";
    var CSRF_TOKEN  = "hOdn5J4A6RWh9hSU5FeTo0wX4PXb1lc5liFN8iLq";
    var CUST_ID     = "39691";

    // Helper global: bisa dipanggil dari template manapun untuk mengambil nama penerima.
    window.fdRecipientName = function () {
        try {
            var v = localStorage.getItem(STORAGE_KEY);
            return v && v.trim() !== '' ? v.trim() : null;
        } catch (e) {
            return null;
        }
    };

    // Catat view ke server SETIAP kali halaman show di-load, selama nama
    // recipient sudah ada (diambil dari localStorage). Owner tidak dihitung
    // (sudah difilter di sisi server).
    function recordView(name) {
        if (!name || !CUST_ID) return;

        fetch(RECORD_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'X-CSRF-TOKEN': CSRF_TOKEN
            },
            body: JSON.stringify({ recipient_name: name })
        }).catch(function () { /* abaikan error jaringan */ });
    }

    document.addEventListener('DOMContentLoaded', function () {
        var overlay = document.getElementById('fdNameOverlay');
        var input   = document.getElementById('fdNameInput');
        var error   = document.getElementById('fdNameError');
        var submit  = document.getElementById('fdNameSubmit');

        if (!overlay || !input || !submit) return;

        // Kalau nama sudah tersimpan sebelumnya, tidak perlu menampilkan modal lagi.
        var existing = window.fdRecipientName();
        if (existing) {
            recordView(existing);
            document.dispatchEvent(new CustomEvent('fd:recipient-name-ready', {
                detail: { name: existing }
            }));
            return;
        }

        overlay.classList.add('show');
        setTimeout(function () { input.focus(); }, 150);

        function save() {
            var name = (input.value || '').trim();
            if (name === '') {
                error.classList.add('show');
                input.focus();
                return;
            }
            try {
                localStorage.setItem(STORAGE_KEY, name);
            } catch (e) { /* abaikan bila storage tidak tersedia */ }

            recordView(name);

            overlay.classList.remove('show');
            document.dispatchEvent(new CustomEvent('fd:recipient-name-ready', {
                detail: { name: name }
            }));
        }

        submit.addEventListener('click', save);
        input.addEventListener('input', function () {
            error.classList.remove('show');
        });
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                save();
            }
        });
    });
})();
</script>
